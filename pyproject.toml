[project]
name = "diffusion-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "modal>=1.6.3",
    "torch>=2.14.1",
]

[dependency-groups]
data = [
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "tiktoken>=0.14.0",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Failed to initialize NumPy"]
